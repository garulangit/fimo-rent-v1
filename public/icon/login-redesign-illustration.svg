<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-labelledby="title">
  <title id="title">Ilustrasi karakter untuk halaman masuk</title>
  <style>
    .par { transform-box: fill-box; transform-origin: 50% 100%; will-change: transform; }
    .pupil { will-change: transform; transition: opacity .2s ease .16s; }
    .xmark { opacity: 0; transition: opacity .12s ease; }
    .sclera { transition: opacity .2s ease .08s; }
    .is-pw .xmark { opacity: 1; transition: opacity .2s ease .18s; }
    .is-pw .sclera, .is-pw .pupil { opacity: 0; transition: opacity .15s ease .18s; }
    .idle { transform-box: fill-box; transform-origin: 50% 100%; }
    .i1 { animation: float 7s ease-in-out infinite; }
    .i2 { animation: breathe 5.4s ease-in-out infinite; }
    .i3 { animation: float 6.2s ease-in-out -2s infinite; }
    .i4 { animation: sway 8.5s ease-in-out -1s infinite; }
    @keyframes float { 50% { transform: translateY(-4px) rotate(.6deg); } }
    @keyframes breathe { 50% { transform: scale(1.012,1.018); } }
    @keyframes sway { 50% { transform: translateY(-3px) rotate(-1deg); } }
    @media (prefers-reduced-motion: reduce) { .idle { animation: none; } .xmark, .sclera, .pupil { transition: none; } }
  </style>
